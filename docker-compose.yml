services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: livlink
      POSTGRES_USER: livlink
      POSTGRES_PASSWORD: livlink
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U livlink -d livlink"]
      interval: 5s
      timeout: 5s
      retries: 10
